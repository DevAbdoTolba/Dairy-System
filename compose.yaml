services:
  dairy-system:
    build: .
    container_name: dairy-system
    restart: unless-stopped
    env_file: .env
    environment:
      DAIRY_DATABASE_PATH: /data/dairy.sqlite
      DAIRY_BACKUP_PATH: /backups
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
